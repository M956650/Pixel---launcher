name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        run: |
          ZIP=$(find . -name "*.zip" -not -path "./.git/*" | head -1)
          if [ -n "$ZIP" ]; then unzip -q "$ZIP" -d work; fi
          S=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
          echo "PROJECT=$(dirname $S)" >> $GITHUB_ENV
          echo "Project folder: $(dirname $S)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle -p "$PROJECT" assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PixelLauncher-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
